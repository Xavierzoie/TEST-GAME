<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12172B">
<title>Drop Four</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root{
    --bg:#12172B;
    --panel:#1B2242;
    --panel-2:#232B52;
    --amber:#F2A65A;
    --amber-dim:#8a6338;
    --teal:#4FD1C5;
    --teal-dim:#317f78;
    --text:#EDEFF7;
    --muted:#7A82A6;
    --tube:#0D1122;
    --sp-xs: clamp(6px, 1.6vw, 8px);
    --sp-sm: clamp(10px, 2.6vw, 14px);
    --sp-md: clamp(14px, 3.4vw, 18px);
    --sp-lg: clamp(20px, 5vw, 28px);
    --board-max: 460px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100dvh;
    background: radial-gradient(circle at 50% -10%, #1c2350 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    overflow-y:auto;
    overscroll-behavior:contain;
  }
  .wrap{
    max-width:720px; margin:0 auto;
    padding:var(--sp-md) clamp(14px,4vw,20px) calc(env(safe-area-inset-bottom,0px) + var(--sp-sm));
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
  }
  .stage{
    display:flex; flex-direction:column; align-items:center;
    width:100%;
    gap:var(--sp-sm);
    transform-origin:center center;
  }
  #app-header{
    display:flex; flex-direction:column; align-items:center;
    flex-shrink:0;
    transition:opacity 0.25s ease, max-height 0.25s ease, margin 0.25s ease;
    overflow:hidden;
  }
  #app-header.header-hidden{
    opacity:0; max-height:0; margin:0; pointer-events:none;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(26px,6.5vw,40px);
    letter-spacing:-0.02em;
    margin:0 0 4px;
    display:flex; align-items:center; gap:10px;
    text-align:center;
  }
  h1 .dot{
    width:14px;height:14px;border-radius:50%;
    background: linear-gradient(135deg, var(--amber), var(--teal));
    display:inline-block;
    flex-shrink:0;
  }
  .tagline{color:var(--muted); font-size:clamp(12px,3vw,14px); margin-bottom:clamp(18px,5vw,28px); text-align:center; max-width:44ch;}

  .screen{width:100%; display:flex; flex-direction:column; align-items:center; gap:var(--sp-md);}
  .hidden{display:none !important;}

  .card{
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:18px;
    padding:clamp(18px,5vw,24px);
    width:100%;
    max-width:420px;
  }
  .card h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px; margin:0 0 14px;
    color:var(--text);
  }
  .landing-row{
    display:flex; flex-direction:column; gap:16px;
    width:100%; max-width:420px; align-items:stretch;
  }
  label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; display:block; margin-bottom:6px;}
  input[type="text"]{
    width:100%; padding:12px 14px; border-radius:10px;
    border:1px solid rgba(255,255,255,0.1);
    background:var(--tube); color:var(--text);
    font-size:16px; font-family:'Space Grotesk',sans-serif; letter-spacing:0.05em;
    margin-bottom:14px;
  }
  input[type="text"]:focus{outline:2px solid var(--teal); outline-offset:1px;}
  input[type="text"]::placeholder{color:#4b5378;}

  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:15px;
    padding:13px 18px; border-radius:10px; border:none;
    cursor:pointer; transition:transform 0.12s ease, filter 0.12s ease;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
    min-height:44px;
  }
  button:disabled{opacity:0.6; cursor:default;}
  button:active{transform:translateY(1px) scale(0.98);}
  button:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .btn-primary{
    background:linear-gradient(135deg, var(--amber), #e08a3c);
    color:#1b1305; width:100%;
    box-shadow:0 3px 0 var(--amber-dim);
  }
  .btn-primary:active{box-shadow:0 1px 0 var(--amber-dim);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{
    background:var(--panel-2); color:var(--text); width:100%;
    border:1px solid rgba(255,255,255,0.08);
  }
  .btn-secondary:hover{filter:brightness(1.15);}
  .btn-ghost{
    background:transparent; color:var(--muted); border:none;
    font-size:13px; padding:8px 12px; text-decoration:underline;
    text-decoration-color:rgba(122,130,166,0.4); text-underline-offset:3px;
    min-height:auto;
  }
  .btn-ghost:hover{color:var(--text);}
  .mute-btn{
    background:var(--panel-2); border:1px solid rgba(255,255,255,0.08);
    border-radius:50%; width:36px; height:36px; padding:0; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    min-height:auto;
  }
  .toolbar-panel{
    display:flex; flex-direction:column; gap:var(--sp-sm);
    width:100%; max-width:var(--board-max);
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    padding:var(--sp-sm);
  }
  .toolbar-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    flex-wrap:wrap;
  }
  .toolbar-row.reaction-row{gap:clamp(5px,2vw,8px);}
  .voice-btn{
    width:auto; flex:none; font-size:14px; padding:10px 16px;
  }
  .voice-btn.active{
    background:linear-gradient(135deg, var(--teal), var(--teal-dim));
    color:#06201d;
  }
  .voice-btn.muted{
    background:var(--panel-2); color:var(--muted);
  }
  .voice-status{color:var(--muted); font-size:12px; text-align:center;}
  .divider{
    display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px;
    margin:2px 0; width:100%; max-width:420px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,0.08);}

  @media (min-width:680px){
    .landing-row{
      flex-direction:row; align-items:stretch; max-width:640px; gap:0;
    }
    .landing-row .card{flex:1; max-width:none;}
    .landing-row .divider{
      flex-direction:column; width:auto; max-width:none; margin:0 18px;
    }
    .landing-row .divider::before,.landing-row .divider::after{width:1px; height:auto; flex:1;}
  }

  .name-hint{color:var(--muted); font-size:12px; margin-top:-8px; margin-bottom:14px;}

  .code-display{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(24px,7vw,36px); font-weight:700; letter-spacing:0.08em;
    color:var(--amber);
    background:var(--tube);
    border-radius:14px; padding:16px 18px;
    text-align:center; width:100%;
    border:1px dashed rgba(242,166,90,0.35);
    word-break:break-all;
  }
  .pulse{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--teal); margin-right:8px;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:1;}}

  .match-bar{
    display:flex; align-items:center; justify-content:center;
    width:100%; max-width:var(--board-max);
    font-family:'Space Grotesk',sans-serif; font-size:15px;
    gap:10px; flex-wrap:wrap;
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    padding:8px 12px;
  }
  .match-bar-div{
    width:1px; align-self:stretch; min-height:22px;
    background:rgba(255,255,255,0.08);
    flex-shrink:0;
  }
  .score-row{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .score-pill{
    min-width:26px; text-align:center; padding:5px 9px; border-radius:20px;
    font-weight:700; font-size:13px; background:var(--panel-2);
  }
  .score-pill.p1{color:var(--amber); box-shadow:inset 0 0 0 1px rgba(242,166,90,0.3);}
  .score-pill.p2{color:var(--teal); box-shadow:inset 0 0 0 1px rgba(79,209,197,0.3);}
  .score-vs{color:var(--muted); font-size:12px;}
  .turn-indicator{
    display:flex; align-items:center; gap:8px;
    padding:6px 12px; border-radius:20px;
    font-size:13px; flex-shrink:0; flex:1;
    justify-content:center;
    min-width:0;
  }
  .turn-indicator span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .swatch{width:12px;height:12px;border-radius:50%; flex-shrink:0;}

  .board-frame{
    background:var(--tube);
    border-radius:20px;
    padding:clamp(8px,2.5vw,14px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.04);
    max-width:var(--board-max); width:100%;
    touch-action:manipulation;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:clamp(4px,1.4vw,6px);
  }
  .ghost-row{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:clamp(4px,1.4vw,6px);
    margin-bottom:clamp(4px,1.4vw,6px);
  }
  .ghost-cell{
    aspect-ratio:1/1;
    border-radius:50%;
    opacity:0;
    transform:scale(0.85);
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .ghost-cell.show.p1{opacity:0.55; transform:scale(1); background:var(--amber);}
  .ghost-cell.show.p2{opacity:0.55; transform:scale(1); background:var(--teal);}
  .col{
    display:flex; flex-direction:column; gap:clamp(4px,1.4vw,6px);
    cursor:pointer;
    border-radius:8px;
    padding:2px;
    transition:background 0.15s ease;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  .col:hover{background:rgba(255,255,255,0.04);}
  .col:focus-visible{outline:2px solid var(--teal); outline-offset:2px; background:rgba(255,255,255,0.05);}
  .col.disabled{cursor:default;}
  .col.disabled:hover{background:none;}
  .cell{
    aspect-ratio:1/1;
    border-radius:50%;
    background:var(--bg);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    position:relative;
  }
  .cell.p1{ background:radial-gradient(circle at 35% 30%, #ffcf94, var(--amber) 60%, var(--amber-dim));
    animation: drop 0.35s cubic-bezier(.35,1.6,.6,1); }
  .cell.p2{ background:radial-gradient(circle at 35% 30%, #a6f5ee, var(--teal) 60%, var(--teal-dim));
    animation: drop 0.35s cubic-bezier(.35,1.6,.6,1); }
  @keyframes drop{
    0%{transform:translateY(-140%) scale(1); opacity:0.6;}
    65%{transform:translateY(4%) scale(1);}
    78%{transform:translateY(-2%) scaleX(1.12) scaleY(0.86);}
    100%{transform:translateY(0) scale(1); opacity:1;}
  }
  .cell.win{
    animation: winPulse 1.1s ease-in-out infinite;
  }
  @keyframes winPulse{
    0%,100%{box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 3px #fff, 0 0 10px 1px #fff;}
    50%{box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 4px #fff, 0 0 20px 6px #fff;}
  }

  .footer-row{
    display:flex; gap:10px; width:100%; max-width:var(--board-max);
  }
  .footer-row button{flex:1; font-size:clamp(13px,3.4vw,15px); padding:13px 10px;}

  @media (max-width:520px){
    .footer-row{
      position:sticky; bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
      padding:10px; margin-top:4px;
      background:rgba(18,23,43,0.82);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.06);
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
    }
  }

  .banner{
    width:100%; max-width:var(--board-max); text-align:center;
    font-family:'Space Grotesk',sans-serif; font-size:clamp(15px,4vw,17px); font-weight:700;
    padding:12px; border-radius:12px;
    background:var(--panel-2);
  }
  .banner.win-you{color:var(--teal); box-shadow:inset 0 0 0 1px rgba(79,209,197,0.4);}
  .banner.win-them{color:var(--amber); box-shadow:inset 0 0 0 1px rgba(242,166,90,0.4);}
  .banner.draw{color:var(--muted);}

  .error-msg{color:#ff8484; font-size:13px; min-height:18px; text-align:center;}
  .conn-status{color:var(--muted); font-size:12px; text-align:center; min-height:16px;}

  .reaction-btn{
    background:var(--panel-2); border:1px solid rgba(255,255,255,0.07);
    border-radius:50%; width:42px; height:42px; font-size:19px;
    display:flex; align-items:center; justify-content:center; padding:0;
    flex-shrink:0; touch-action:manipulation; min-height:auto;
  }
  .reaction-btn:hover{background:var(--panel); transform:scale(1.08);}
  .reaction-btn:active{transform:scale(0.92);}

  .flying-emoji{
    position:absolute; font-size:34px; bottom:60px;
    animation: floatUp 2.2s ease-out forwards;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(0.6); opacity:0;}
    15%{opacity:1; transform:translateY(-20px) scale(1.1);}
    100%{transform:translateY(-320px) scale(1); opacity:0;}
  }

  .disconnected-overlay{
    text-align:center; font-family:'Space Grotesk',sans-serif; font-weight:700;
    color:#ff8484; font-size:15px; margin-top:10px;
  }

  @media (prefers-reduced-motion: reduce){
    .cell.p1, .cell.p2{animation:none;}
    .pulse{animation:none;}
    .cell.win{animation:none;}
    .screen-anim{animation:none;}
    .turn-indicator.my-turn{animation:none;}
    .score-pill.bump{animation:none;}
    h1 .dot{animation:none;}
    .banner{animation:none;}
    .board-frame{animation:none;}
  }

  /* ---------- animation layer ---------- */
  @keyframes screenIn{
    0%{opacity:0; transform:translateY(10px) scale(0.985);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .screen-anim{animation: screenIn 0.42s cubic-bezier(.22,.85,.32,1) both;}

  h1 .dot{
    background-size:200% 200%;
    animation: dotShift 4s ease-in-out infinite;
  }
  @keyframes dotShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }

  .turn-indicator.my-turn{
    animation: turnGlow 1.7s ease-in-out infinite;
  }
  @keyframes turnGlow{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(79,209,197,0.15), 0 0 0 0 rgba(79,209,197,0.0);}
    50%{box-shadow:inset 0 0 0 1px rgba(79,209,197,0.5), 0 0 14px 1px rgba(79,209,197,0.35);}
  }

  .score-pill.bump{animation: pillBump 0.5s cubic-bezier(.36,1.8,.4,1);}
  @keyframes pillBump{
    0%{transform:scale(1);}
    35%{transform:scale(1.35);}
    100%{transform:scale(1);}
  }

  .banner{animation: bannerIn 0.4s cubic-bezier(.22,.9,.3,1) both;}
  @keyframes bannerIn{
    0%{opacity:0; transform:scale(0.9) translateY(6px);}
    100%{opacity:1; transform:scale(1) translateY(0);}
  }

  .board-frame{animation: boardIn 0.5s cubic-bezier(.2,.85,.3,1) both;}
  @keyframes boardIn{
    0%{opacity:0; transform:scale(0.94);}
    100%{opacity:1; transform:scale(1);}
  }

  /* very narrow phones (older/small devices) */
  @media (max-width:360px){
    .tagline{display:none;}
    .match-bar{font-size:13px; padding:6px 8px;}
    .turn-indicator{padding:5px 8px; font-size:11px;}
    .code-display{letter-spacing:0.04em;}
    #waiting-qr{width:130px; height:130px;}
    .reaction-btn{width:38px; height:38px; font-size:17px;}
  }

  /* short / landscape viewports: tighten vertical rhythm so the board fits */
  @media (max-height:640px) and (orientation:landscape){
    .wrap{padding-top:12px; padding-bottom:20px;}
    h1{font-size:22px; margin-bottom:0;}
    .tagline{display:none;}
    .screen{gap:10px;}
    .card{padding:14px;}
    .toolbar-panel{padding:8px;}
  }

  /* larger screens: give the board a bit more room to breathe */
  @media (min-width:900px){
    :root{ --board-max: 520px; }
  }
</style>
</head>
<body>
<div class="wrap">
<div class="stage" id="stage">
  <div id="app-header">
    <h1><span class="dot"></span>Drop Four</h1>
    <div class="tagline">Connect four in a row. Play with someone on another device — connects directly, device to device.</div>
  </div>

  <div id="screen-landing" class="screen">
    <div class="landing-row">
      <div class="card">
        <h2>Your name</h2>
        <input type="text" id="input-name" placeholder="e.g. Hope" maxlength="16">
        <h2>Start a game</h2>
        <button class="btn-primary" id="btn-create">Create a room</button>
      </div>

      <div class="divider">or join a friend</div>

      <div class="card">
        <label for="input-code">Room code</label>
        <input type="text" id="input-code" placeholder="paste the code they sent you">
        <button class="btn-secondary" id="btn-join">Join room</button>
      </div>
    </div>
    <div class="error-msg" id="landing-error"></div>
    <button class="btn-ghost" id="btn-practice">Or practice solo against the computer →</button>
  </div>

  <div id="screen-waiting" class="screen hidden">
    <div class="card" style="text-align:center;">
      <h2><span class="pulse"></span>Waiting for your opponent</h2>
      <div class="name-hint" style="margin-bottom:14px;">Send this code to them — they paste it under "Join room" from their device.</div>
      <div class="code-display" id="waiting-code">----</div>
      <img id="waiting-qr" alt="QR code for the room" style="margin-top:14px; border-radius:12px; width:150px; height:150px; background:#fff; padding:8px;">
      <button class="btn-secondary" id="btn-copy-code" style="margin-top:14px;">Copy code</button>
    </div>
    <button class="btn-secondary" id="btn-cancel-wait" style="max-width:420px;">Cancel</button>
  </div>

  <div id="screen-game" class="screen hidden">
    <div class="match-bar">
      <div class="score-row" id="score-row">
        <span class="score-pill p1" id="score-p1">0</span>
        <span class="score-vs">–</span>
        <span class="score-pill p2" id="score-p2">0</span>
      </div>
      <div class="match-bar-div"></div>
      <div class="turn-indicator" id="turn-indicator">
        <span class="swatch" id="turn-swatch"></span>
        <span id="turn-text">—</span>
      </div>
      <button class="mute-btn" id="btn-mute" aria-label="Mute sound" title="Mute sound">🔊</button>
    </div>
    <div class="board-frame" id="board-frame">
      <div class="ghost-row" id="ghost-row"></div>
      <div class="board" id="board"></div>
    </div>
    <div class="toolbar-panel hidden" id="toolbar-panel">
      <div class="toolbar-row" id="voice-row">
        <button class="btn-secondary voice-btn" id="btn-voice">🎙️ Enable voice chat</button>
        <span class="voice-status" id="voice-status"></span>
      </div>
      <div class="toolbar-row reaction-row" id="reaction-bar">
        <button class="reaction-btn" data-emoji="🔥">🔥</button>
        <button class="reaction-btn" data-emoji="😂">😂</button>
        <button class="reaction-btn" data-emoji="😱">😱</button>
        <button class="reaction-btn" data-emoji="👏">👏</button>
        <button class="reaction-btn" data-emoji="😤">😤</button>
      </div>
    </div>
    <div class="banner hidden" id="banner"></div>
    <div class="conn-status" id="conn-status"></div>
    <div class="footer-row">
      <button class="btn-secondary" id="btn-rematch" disabled>Rematch</button>
      <button class="btn-secondary" id="btn-leave">Leave room</button>
    </div>
  </div>
</div>
</div>
<audio id="remote-audio" autoplay playsinline></audio>
<div id="reaction-fly-layer" style="position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden;"></div>
<canvas id="confetti-canvas" style="position:fixed; inset:0; pointer-events:none; z-index:50; display:none;"></canvas>

<script>
(function(){
  const ROWS = 6, COLS = 7;
  let myName = '';
  let mySymbol = null; // 1 = host, 2 = guest
  let peer = null;
  let conn = null;
  let isHost = false;

  let state = null; // authoritative game state, mirrored on both sides
  let score = {1: 0, 2: 0};
  let audioCtx = null;
  let soundOn = true;
  let isBotGame = false;

  // voice chat
  let localStream = null;
  let mediaCall = null;
  let myVoiceReady = false;
  let remoteVoiceReady = false;
  let micMuted = false;

  const el = id => document.getElementById(id);
  const show = id => {
    const e = el(id);
    if(e.classList.contains('hidden')){
      e.classList.remove('hidden');
      e.classList.remove('screen-anim');
      void e.offsetWidth;
      e.classList.add('screen-anim');
    }
  };
  const hide = id => el(id).classList.add('hidden');

  // ---------- Fit the whole game to the viewport, no page scroll needed ----------
  let fitRAF = null;
  function fitBoard(){
    if(fitRAF) cancelAnimationFrame(fitRAF);
    fitRAF = requestAnimationFrame(() => {
      const screenGame = document.getElementById('screen-game');
      const boardFrame = document.getElementById('board-frame');
      const wrap = document.querySelector('.wrap');
      const isGameVisible = screenGame && !screenGame.classList.contains('hidden');

      if(!isGameVisible || !boardFrame || !wrap){
        fitScreen();
        return;
      }

      // measure siblings at a generous width first so shrinking doesn't
      // self-reinforce (a smaller board could hide a wrapped line, etc.)
      document.documentElement.style.setProperty('--board-max', '560px');

      requestAnimationFrame(() => {
        const children = Array.from(screenGame.children).filter(c => c.offsetParent !== null);
        const gapPx = parseFloat(getComputedStyle(screenGame).rowGap) || 0;
        let siblingsHeight = 0;
        children.forEach(c => { if(c !== boardFrame) siblingsHeight += c.getBoundingClientRect().height; });
        const gapsCount = Math.max(0, children.length - 1);

        const wrapStyle = getComputedStyle(wrap);
        const wrapPadY = (parseFloat(wrapStyle.paddingTop)||0) + (parseFloat(wrapStyle.paddingBottom)||0);
        const wrapPadX = (parseFloat(wrapStyle.paddingLeft)||0) + (parseFloat(wrapStyle.paddingRight)||0);
        const headerH = el('app-header').classList.contains('header-hidden') ? 0 : el('app-header').getBoundingClientRect().height;

        const viewportH = window.innerHeight;
        const availableForBoard = viewportH - wrapPadY - headerH - siblingsHeight - (gapPx*gapsCount) - 6;
        const availableWidth = Math.min(window.innerWidth, wrap.clientWidth) - wrapPadX;

        const finalSize = Math.max(180, Math.min(availableWidth, availableForBoard, 560));
        document.documentElement.style.setProperty('--board-max', Math.floor(finalSize) + 'px');

        fitScreen();
      });
    });
  }

  // Universal safety net: after the board (if any) is sized, check whether
  // the whole visible screen — landing, waiting, or game — still exceeds
  // the viewport, and if so scale the entire stage down as one unit so
  // nothing ever needs to scroll, on any screen, on any device.
  function fitScreen(){
    requestAnimationFrame(() => {
      const stage = document.getElementById('stage');
      const wrap = document.querySelector('.wrap');
      if(!stage || !wrap) return;

      stage.style.transform = 'none';
      const naturalH = stage.scrollHeight;
      const naturalW = stage.scrollWidth;

      const wrapStyle = getComputedStyle(wrap);
      const wrapPadY = (parseFloat(wrapStyle.paddingTop)||0) + (parseFloat(wrapStyle.paddingBottom)||0);
      const wrapPadX = (parseFloat(wrapStyle.paddingLeft)||0) + (parseFloat(wrapStyle.paddingRight)||0);
      const availH = window.innerHeight - wrapPadY;
      const availW = window.innerWidth - wrapPadX;

      const scale = Math.min(1, (availH / naturalH) * 0.985, (availW / naturalW) * 0.985);
      stage.style.transform = scale < 0.99 ? ('scale(' + scale + ')') : 'none';
    });
  }

  window.addEventListener('resize', fitBoard);
  window.addEventListener('orientationchange', fitBoard);

  function vibrate(pattern){
    try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
  }


  function beep(freq, dur, type, vol){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }catch(e){ /* audio unavailable, ignore */ }
  }
  function sfxDrop(){ beep(220, 0.15, 'sine', 0.09); }
  function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.35,'triangle',0.1), i*110)); }
  function sfxDraw(){ beep(200, 0.4, 'sawtooth', 0.05); }

  function emptyBoard(){
    return Array.from({length: ROWS}, () => Array(COLS).fill(0));
  }

  // lowercase only, and skip look-alike chars (l/1/o/0) — avoids any
  // case-mismatch when the code gets copy-pasted or auto-capitalized
  function genCode(){
    const chars = 'abcdefghjkmnpqrstuvwxyz23456789';
    let c = 'drop4-';
    for(let i=0;i<8;i++) c += chars[Math.floor(Math.random()*chars.length)];
    return c;
  }

  // free public TURN relay (in addition to Google's STUN) so devices on
  // restrictive networks (mobile data, some WiFi/firewalls) can still
  // connect when a direct peer-to-peer path isn't possible
  const ICE_CONFIG = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  };

  function freshState(hostName, guestName){
    return {
      names: {1: hostName, 2: guestName || null},
      board: emptyBoard(),
      turn: 1,
      winner: 0,
      winLine: null,
      rematchVotes: []
    };
  }

  function setConnStatus(msg){ el('conn-status').textContent = msg || ''; }

  // ---------- Landing actions ----------
  el('btn-create').addEventListener('click', () => {
    el('landing-error').textContent = '';
    myName = (el('input-name').value || 'Player 1').trim().slice(0,16) || 'Player 1';
    isHost = true;
    mySymbol = 1;
    const code = genCode();

    const createBtn = el('btn-create');
    createBtn.disabled = true;
    const originalLabel = createBtn.textContent;
    createBtn.textContent = 'Connecting…';

    try{
      peer = new Peer(code, {config: ICE_CONFIG});
    }catch(e){
      createBtn.disabled = false; createBtn.textContent = originalLabel;
      el('landing-error').textContent = "Couldn't start a room (" + e.message + ").";
      return;
    }
    registerVoiceCallHandler();

    peer.on('open', (id) => {
      createBtn.disabled = false; createBtn.textContent = originalLabel;
      el('waiting-code').textContent = id;
      el('waiting-qr').src = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(id);
      hide('screen-landing'); show('screen-waiting');
      el('app-header').classList.add('header-hidden');
      fitBoard();
    });

    peer.on('connection', (c) => {
      if(conn){ c.close(); return; } // already have a guest
      conn = c;
      wireConnection();
      conn.on('open', () => {
        // ask guest for their name via a hello, they'll send it
        setConnStatus('Opponent connected.');
      });
    });

    peer.on('error', (err) => {
      createBtn.disabled = false; createBtn.textContent = originalLabel;
      el('landing-error').textContent = "Connection error (" + err.type + "). Try again.";
      hide('screen-waiting'); show('screen-landing');
      el('app-header').classList.remove('header-hidden');
      fitBoard();
    });
  });

  el('btn-join').addEventListener('click', () => {
    el('landing-error').textContent = '';
    myName = (el('input-name').value || 'Player 2').trim().slice(0,16) || 'Player 2';

      el('landing-error').textContent = 'Paste the room code your friend sent you.';

    isHost = false;
    mySymbol = 2;

    const joinBtn = el('btn-join');
    joinBtn.disabled = true;
    const originalLabel = joinBtn.textContent;

    try{
      peer = new Peer({config: ICE_CONFIG});
    }catch(e){
      joinBtn.disabled = false; joinBtn.textContent = originalLabel;
      el('landing-error').textContent = "Couldn't connect (" + e.message + ").";
      return;
    }
    registerVoiceCallHandler();

    peer.on('open', () => {
      conn = peer.connect(rawCode, {reliable:true});
      wireConnection();

      const failTimer = setTimeout(() => {
        joinBtn.disabled = false; joinBtn.textContent = originalLabel;
        el('landing-error').textContent = "Couldn't reach that room. Check the code and that they're still waiting.";
      }, 15000);

    });
  });

  el('btn-practice').addEventListener('click', () => {
    myName = (el('input-name').value || 'You').trim().slice(0,16) || 'You';
    isHost = true; isBotGame = true; mySymbol = 1;
    conn = null; peer = null;
    state = freshState(myName, 'Computer');
    lastWinner = 0;
    score = {1:0, 2:0};
    hide('screen-landing'); show('screen-game');
    hide('toolbar-panel');
    el('app-header').classList.add('header-hidden');

    fitBoard();
  });

  el('btn-copy-code').addEventListener('click', () => {
    const code = el('waiting-code').textContent;
    if(navigator.clipboard){
      navigator.clipboard.writeText(code).then(() => {
        el('btn-copy-code').textContent = 'Copied!';

  el('btn-cancel-wait').addEventListener('click', () => {
    if(peer) peer.destroy();
    hide('screen-waiting'); show('screen-landing');

    fitBoard();
  });

  el('btn-leave').addEventListener('click', () => {
    teardownVoice();
    if(peer) peer.destroy();
    state = null; conn = null; peer = null; isBotGame = false;

    hide('screen-game'); show('screen-landing');
    el('app-header').classList.remove('header-hidden');
    fitBoard();
  });

  el('btn-mute').addEventListener('click', () => {
    soundOn = !soundOn;
    el('btn-mute').textContent = soundOn ? '🔊' : '🔇';
    el('btn-mute').setAttribute('aria-label', soundOn ? 'Mute sound' : 'Unmute sound');
  });

  // ---------- Connection wiring ----------
  function wireConnection(){
    conn.on('data', handleData);
    conn.on('close', () => {
      setConnStatus('Opponent disconnected.');
      const banner = el('banner');
      banner.textContent = 'Opponent disconnected — the room is no longer live.';
      banner.className = 'banner win-them';
      show('banner');
      el('btn-rematch').disabled = true;
      teardownVoice();
    });
    conn.on('error', () => {
      setConnStatus('Connection lost.');
    });
  }

  // ---------- Voice chat ----------
  function setVoiceStatus(msg){ const s = el('voice-status'); if(s) s.textContent = msg || ''; }

  function registerVoiceCallHandler(){
    peer.on('call', (call) => {
      if(localStream){
        call.answer(localStream);
        wireMediaCall(call);
      } else {
        // we haven't enabled our mic yet — answer audio-less so at least
        // they can hear us once we do, and let them know to wait
        call.answer();
        wireMediaCall(call);
        setVoiceStatus('Opponent started voice chat — enable yours to talk back.');
      }
    });
  }

  function wireMediaCall(call){
    mediaCall = call;
    call.on('stream', (remoteStream) => {
      const audioEl = el('remote-audio');
      audioEl.srcObject = remoteStream;
      setVoiceStatus('Voice chat connected.');
    });
    call.on('close', () => {
      setVoiceStatus('Voice chat ended.');
      mediaCall = null;
    });
    call.on('error', () => {
      setVoiceStatus('Voice chat connection error.');
    });
  }

  function startOutgoingCall(){
    if(!conn || !localStream) return;
    const call = peer.call(conn.peer, localStream);
    if(call) wireMediaCall(call);
  }

  function teardownVoice(){
    if(mediaCall){ try{ mediaCall.close(); }catch(e){} mediaCall = null; }
    if(localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
    myVoiceReady = false; remoteVoiceReady = false; micMuted = false;
    const btn = el('btn-voice');
    if(btn){ btn.textContent = '🎙️ Enable voice chat'; btn.className = 'btn-secondary voice-btn'; }
    setVoiceStatus('');
  }

  el('btn-voice').addEventListener('click', async () => {
    const btn = el('btn-voice');
    if(!myVoiceReady){
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        setVoiceStatus("Voice chat isn't supported in this browser.");
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Requesting mic…';
      try{
        localStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
      }catch(e){
        btn.disabled = false;
        btn.textContent = '🎙️ Enable voice chat';
        setVoiceStatus("Couldn't access your microphone (" + (e && e.message ? e.message : 'permission denied') + ").");
        return;
      }
      myVoiceReady = true;
      btn.disabled = false;
      btn.textContent = '🎙️ Mic on';
      btn.className = 'btn-secondary voice-btn active';
      setVoiceStatus('Waiting for opponent…');
      if(conn && conn.open) conn.send({type:'voice-ready'});
      if(isHost && remoteVoiceReady && !mediaCall){
        startOutgoingCall();
      }
    } else {
      // toggle mic mute
      micMuted = !micMuted;
      if(localStream) localStream.getAudioTracks().forEach(t => { t.enabled = !micMuted; });
      btn.textContent = micMuted ? '🔇 Mic muted' : '🎙️ Mic on';
      btn.className = 'btn-secondary voice-btn' + (micMuted ? ' muted' : ' active');
    }
  });

  function handleData(msg){
    if(!msg || !msg.type) return;

    if(msg.type === 'emoji'){
      showFlyingEmoji(msg.emoji, false);
      return;
    }

    if(msg.type === 'voice-ready'){
      remoteVoiceReady = true;
      setVoiceStatus('Opponent enabled voice chat.');
      if(isHost && myVoiceReady && !mediaCall){
        startOutgoingCall();
      }
      return;
    }

    if(isHost){
      if(msg.type === 'hello'){
        state = freshState(myName, msg.name);
        hide('screen-waiting'); show('screen-game'); show('toolbar-panel');
        fitBoard();
        broadcast();
        render();
      } else if(msg.type === 'move'){
        applyMove(msg.col, 2);
      } else if(msg.type === 'rematchVote'){
        castRematchVote(2);
      }
    } else {
      if(msg.type === 'state'){
        state = msg.state;
        render();
      }
    }
  }

  function broadcast(){
    if(conn && conn.open){
      conn.send({type:'state', state: state});
    }
  }

  // ---------- Game logic (host authoritative) ----------
  function checkWinner(board){
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const v = board[r][c];
        if(!v) continue;
        for(const [dr,dc] of dirs){
          const line = [[r,c]];
          for(let k=1;k<4;k++){
            const nr = r+dr*k, nc = c+dc*k;
            if(nr<0||nr>=ROWS||nc<0||nc>=COLS||board[nr][nc]!==v) break;
            line.push([nr,nc]);
          }
          if(line.length===4) return {winner:v, line};
        }
      }
    }
    const full = board.every(row => row.every(c=>c!==0));
    if(full) return {winner:3, line:null};
    return {winner:0, line:null};
  }

  function applyMove(col, bySymbol){
    if(!state || state.winner || state.turn !== bySymbol) return;
    const board = state.board;
    let row = -1;
    for(let r=ROWS-1;r>=0;r--){
      if(board[r][col]===0){ row = r; break; }
    }
    if(row === -1) return;
    board[row][col] = bySymbol;
    const result = checkWinner(board);
    state.board = board;
    state.winner = result.winner;
    state.winLine = result.line;
    state.turn = bySymbol === 1 ? 2 : 1;
    broadcast();
    render();
    if(isBotGame && !state.winner && state.turn === 2){
      setTimeout(botMove, 550);
    }
  }

  function castRematchVote(bySymbol){
    if(isBotGame){
      state.board = emptyBoard();
      state.winner = 0;
      state.winLine = null;
      state.rematchVotes = [];
      state.turn = state.turn === 1 ? 2 : 1;
      render();
      if(state.turn === 2) setTimeout(botMove, 550);
      return;
    }
    state.rematchVotes = state.rematchVotes || [];
    if(!state.rematchVotes.includes(bySymbol)) state.rematchVotes.push(bySymbol);
    if(state.rematchVotes.length >= 2){
      state.board = emptyBoard();
      state.winner = 0;
      state.winLine = null;
      state.rematchVotes = [];
      state.turn = state.turn === 1 ? 2 : 1;
    }
    broadcast();
    render();
  }

  // ---------- Simple bot opponent ----------
  function validCols(board){
    const cols = [];
    for(let c=0;c<COLS;c++) if(board[0][c]===0) cols.push(c);
    return cols;
  }

  function dropOn(board, col, symbol){
    const copy = board.map(row => row.slice());
    for(let r=ROWS-1;r>=0;r--){
      if(copy[r][col]===0){ copy[r][col]=symbol; return copy; }
    }
    return null;
  }

  function botMove(){
    if(!state || state.winner || state.turn !== 2) return;
    const board = state.board;
    const options = validCols(board);
    if(options.length === 0) return;

    // 1) take a winning move if one exists
    for(const c of options){
      const b = dropOn(board, c, 2);
      if(b && checkWinner(b).winner === 2){ finishBotMove(c); return; }
    }
    // 2) block the opponent's winning move
    for(const c of options){
      const b = dropOn(board, c, 1);
      if(b && checkWinner(b).winner === 1){ finishBotMove(c); return; }
    }
    // 3) otherwise prefer center columns, with a little randomness
    const weights = options.map(c => ({c, w: 4 - Math.abs(c-3) + Math.random()*1.5}));
    weights.sort((a,b) => b.w - a.w);
    finishBotMove(weights[0].c);
  }

  function finishBotMove(col){
    sfxDrop();
    vibrate(20);
    applyMove(col, 2);
  }

  // ---------- Rendering ----------
  let lastWinner = 0;
  let hoverCol = null;

  function landingRow(board, col){
    for(let r=ROWS-1;r>=0;r--){
      if(board[r][col]===0) return r;
    }
    return -1;
  }

  function renderGhost(){
    const ghostEl = el('ghost-row');
    ghostEl.innerHTML = '';
    for(let c=0;c<COLS;c++){
      const g = document.createElement('div');
      g.className = 'ghost-cell';
      const myTurn = state && state.turn === mySymbol && !state.winner;
      if(myTurn && hoverCol === c && landingRow(state.board, c) !== -1){
        g.className += ' show p' + mySymbol;
      }
      ghostEl.appendChild(g);
    }
  }

  function render(){
    if(!state) return;
    setConnStatus('');

    const p1 = el('score-p1'); const p2 = el('score-p2');
    if(p1) p1.textContent = score[1];
    if(p2) p2.textContent = score[2];

    const boardEl = el('board');
    boardEl.innerHTML = '';
    for(let c=0;c<COLS;c++){
      const colDiv = document.createElement('div');
      const colFull = state.board[0][c] !== 0;
      const myTurn = state.turn === mySymbol && !state.winner;
      colDiv.className = 'col' + ((myTurn && !colFull) ? '' : ' disabled');
      colDiv.setAttribute('role','button');
      colDiv.setAttribute('aria-label', 'Drop in column ' + (c+1));
      if(myTurn && !colFull) colDiv.setAttribute('tabindex','0');
      for(let r=0;r<ROWS;r++){
        const cell = document.createElement('div');
        const v = state.board[r][c];
        let cls = 'cell';
        if(v===1) cls += ' p1';
        if(v===2) cls += ' p2';
        if(state.winLine && state.winLine.some(([wr,wc]) => wr===r && wc===c)) cls += ' win';
        cell.className = cls;
        colDiv.appendChild(cell);
      }
      if(myTurn && !colFull){
        const drop = () => {
          sfxDrop();
          vibrate(15);
          if(isHost) applyMove(c, 1);
          else if(conn && conn.open) conn.send({type:'move', col:c});
        };
        colDiv.addEventListener('mouseenter', () => { hoverCol = c; renderGhost(); });
        colDiv.addEventListener('mouseleave', () => { if(hoverCol===c){ hoverCol=null; renderGhost(); } });
        colDiv.addEventListener('focus', () => { hoverCol = c; renderGhost(); });
        colDiv.addEventListener('blur', () => { if(hoverCol===c){ hoverCol=null; renderGhost(); } });
        colDiv.addEventListener('click', drop);
        colDiv.addEventListener('keydown', (e) => {
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); drop(); }
        });
      }
      boardEl.appendChild(colDiv);
    }
    renderGhost();

    const swatch = el('turn-swatch');
    const turnText = el('turn-text');
    const turnIndicator = el('turn-indicator');
    if(state.winner){
      turnIndicator.style.visibility = 'hidden';
      turnIndicator.classList.remove('my-turn');
    } else {
      turnIndicator.style.visibility = 'visible';
      swatch.style.background = state.turn === 1 ? 'var(--amber)' : 'var(--teal)';
      turnText.textContent = state.turn === mySymbol ? 'Your turn' : (state.names[state.turn] || 'Opponent') + "'s turn";
      turnIndicator.classList.toggle('my-turn', state.turn === mySymbol);
    }

    const banner = el('banner');
    if(state.winner){
      show('banner');
      if(state.winner === 3){
        banner.textContent = "It's a draw.";
        banner.className = 'banner draw';
      } else if(state.winner === mySymbol){
        banner.textContent = 'You win! \ud83c\udf89';
        banner.className = 'banner win-you';
      } else {
        const oppSym = mySymbol === 1 ? 2 : 1;
        banner.textContent = (state.names[oppSym] || 'Opponent') + ' wins.';
        banner.className = 'banner win-them';
      }
      if(lastWinner === 0){
        // transition into a win/draw this render — fire feedback once
        if(state.winner === 3){
          sfxDraw();
        } else {
          score[state.winner] = (score[state.winner] || 0) + 1;
          const bumpEl = el('score-p' + state.winner);
          if(bumpEl){
            bumpEl.textContent = score[state.winner];
            bumpEl.classList.remove('bump');
            void bumpEl.offsetWidth;
            bumpEl.classList.add('bump');
          }
          sfxWin();
          if(state.winner === mySymbol){ launchConfetti(); vibrate([30,50,30,50,60]); }
          else { vibrate(80); }
        }
      }
    } else {
      hide('banner');
    }
    lastWinner = state.winner;

    const rematchBtn = el('btn-rematch');
    if(state.winner){
      rematchBtn.disabled = (state.rematchVotes||[]).includes(mySymbol);
      rematchBtn.textContent = rematchBtn.disabled ? 'Waiting for opponent…' : 'Rematch';
    } else {
      rematchBtn.disabled = true;
      rematchBtn.textContent = 'Rematch';
    }
    fitBoard();
  }

  // keyboard: number keys 1-7 drop into that column
  document.addEventListener('keydown', (e) => {
    if(!state || state.winner || state.turn !== mySymbol) return;
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= 7){
      const c = n - 1;
      if(landingRow(state.board, c) === -1) return;
      sfxDrop();
      if(isHost) applyMove(c, 1);
      else if(conn && conn.open) conn.send({type:'move', col:c});
    }
  });

  // ---------- Reactions ----------
  document.querySelectorAll('.reaction-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const emoji = btn.getAttribute('data-emoji');
      showFlyingEmoji(emoji, true);
      if(conn && conn.open) conn.send({type:'emoji', emoji});
    });
  });

  function showFlyingEmoji(emoji, mine){
    const layer = el('reaction-fly-layer');
    const span = document.createElement('span');
    span.className = 'flying-emoji';
    span.textContent = emoji;
    const leftPct = mine ? (55 + Math.random()*30) : (15 + Math.random()*30);
    span.style.left = leftPct + '%';
    layer.appendChild(span);
    setTimeout(() => span.remove(), 2300);
  }

  // ---------- Confetti ----------
  function launchConfetti(){
    const canvas = el('confetti-canvas');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    canvas.style.display = 'block';
    const ctx = canvas.getContext('2d');
    const colors = ['#F2A65A','#4FD1C5','#EDEFF7','#e08a3c'];
    const pieces = Array.from({length: 90}, () => ({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.3,
      w: 6 + Math.random()*6,
      h: 8 + Math.random()*8,
      vy: 2 + Math.random()*3,
      vx: -1.5 + Math.random()*3,
      rot: Math.random()*360,
      vr: -6 + Math.random()*12,
      color: colors[Math.floor(Math.random()*colors.length)]
    }));
    let frames = 0;
    function tick(){
      frames++;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      let anyVisible = false;
      for(const p of pieces){
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if(p.y < canvas.height + 20) anyVisible = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot * Math.PI/180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
      if(anyVisible && frames < 240){
        requestAnimationFrame(tick);
      } else {
        canvas.style.display = 'none';
      }
    }
    requestAnimationFrame(tick);
  }

  el('btn-rematch').addEventListener('click', () => {
    if(isHost) castRematchVote(1);
    else if(conn && conn.open) conn.send({type:'rematchVote'});
  });

  // initial fit once fonts/layout have settled
  fitBoard();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(fitBoard).catch(() => {});
  }

})();
</script>
</body>
</html>
